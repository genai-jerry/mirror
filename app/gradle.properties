org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The backend the systemTest flavour is built against. Override it on the
# command line for an environment that is not the local one:
#   ./gradlew assembleSystemTestDebug -Pmirror.systemTestBackendUrl=http://host:8000/
mirror.systemTestBackendUrl=http://127.0.0.1:8000/

# The app token each flavour carries (design decision D10). Empty means the
# backend asks for none, which is the default on both sides. Set it only for a
# backend started with APP_TOKEN, and pass it on the command line rather than
# committing it:
#   ./gradlew assembleSystemTestDebug -Pmirror.systemTestAppToken=the-token
mirror.devAppToken=
mirror.systemTestAppToken=
